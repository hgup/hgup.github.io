                title: "1. Industrial Policy",
                mnemonic: "Remember the shift: From 'License Raj' (Control) to 'LPG' (Freedom). Think: 1948 (Mixed), 1956 (State focus), 1991 (Liberalization & FDI).",
                content: `
                    <p>The industrial policy of India has undergone significant transformations since independence, transitioning from a rigid state controlled model to a dynamic market driven approach. The Industrial Policy Resolution of 1948 laid the foundation for a mixed economy, dividing industries into four broad categories with varying degrees of state monopoly and private participation. This was followed by the Industries (Development and Regulation) Act of 1951, which established the infamous "license raj." This act gave the government immense power to regulate industrial capacity, location, and expansion to ensure planned economic development.</p>
                    <p>The Industrial Policy Resolution of 1956 is often called the Economic Constitution of India. It classified industries into three distinct schedules. Schedule A consisted of 17 industries reserved exclusively for the state, covering arms, atomic energy, and railways. Schedule B contained 12 industries where the state would take the lead, but private enterprise could supplement it. Schedule C included all remaining industries left to the private sector, subject to heavy state licensing. This policy heavily prioritized the public sector and heavy industries to build a self reliant economy.</p>
                    <p>Over the decades, this rigid regulatory system led to severe inefficiencies, a lack of competitiveness, technological obsolescence, and slow growth. The paradigm shifted completely with the Industrial Policy of 1991. This landmark liberalization policy dismantled the licensing regime for all but a few hazardous and environmentally sensitive industries. The number of industries reserved for the public sector was drastically reduced, ultimately coming down to just two core areas: atomic energy and specific railway operations. Furthermore, the 1991 policy opened the doors to Foreign Direct Investment. It allowed automatic approval up to 51 percent in high priority sectors, thereby integrating Indian industry with the global market, promoting fierce competition, and facilitating the transfer of advanced technology. The role of the public sector was redefined to focus only on strategic and essential infrastructure areas, paving the way for a more vibrant and globally competitive Indian industrial landscape.</p>

            {
                title: "2. Money Market",
                mnemonic: "SOUL: Short-term, Organized (RBI, DFHI), Unorganized (moneylenders), Liquidity. Remember Vaghul Committee (1987) for reforms.",
                content: `
                    <p>The Indian money market is a crucial mechanism for borrowing and lending short term funds, typically for a period of up to one year. It is absolutely essential for maintaining liquidity in the economy and facilitating the short term cash requirements of banks, the central government, and large corporations. A defining characteristic of the Indian money market is its dichotomous nature, meaning it is split into two distinct and somewhat disconnected sectors: the organized sector and the unorganized sector.</p>
                    <p>The organized sector is highly regulated by the central bank and includes the Reserve Bank of India, commercial banks, cooperative banks, and specialized institutions like the Discount and Finance House of India. The financial instruments traded here include treasury bills issued by the government to manage short term deficits, commercial paper issued by highly rated corporations, certificates of deposit from commercial banks, and call money used for interbank borrowing. Conversely, the unorganized sector consists of indigenous bankers and local moneylenders who operate outside strict regulatory frameworks. While their overall influence has waned over the years, they still play a significant role in rural areas and among small traders where formal banking reach is limited.</p>
                    <p>Historically, the Indian money market suffered from several structural defects. These included a lack of integration between the organized and unorganized sectors, highly volatile interest rates, a shortage of diverse financial instruments, and seasonal stringency during agricultural harvest seasons. Major structural reforms were initiated following the Vaghul Committee recommendations in 1987. These reforms introduced new financial instruments to deepen the market and established the Discount and Finance House of India to provide much needed liquidity. Furthermore, interest rates were progressively deregulated to reflect true market conditions rather than administrative dictates. Electronic clearing systems and negotiated dealing systems were also implemented, making the Indian money market significantly more modern, transparent, liquid, and efficient for all participating entities.</p>
                `,

            {

                mnemonic: "CREDIT: Capital saving, Regional balance, Employment generation, Decentralization, Intensive labor, Technology upgrades needed.",
                content: `
                    <p>Small Scale Industries and cottage industries play an indispensable role in the socio economic development of India. Because these industries are highly labor intensive by nature, they are absolutely essential for tackling the country's massive unemployment and underemployment problems. They require comparatively lower capital investment per worker, making them the ideal solution for an economy characterized by scarce capital and abundant labor resources. Furthermore, they promote decentralized industrial development, helping to reduce regional economic imbalances and prevent massive, unsustainable migration from rural areas to urban centers. They also contribute substantially to the country's total manufacturing output and account for a remarkably large percentage of total export earnings.</p>
                    <p>Historically, the Indian government has protected this vital sector through various policies, such as reserving specific products exclusively for small scale manufacturing and offering numerous financial subsidies and tax holidays. Census data consistently highlights that small scale units make up the vast majority of all registered and unregistered industrial units in India. However, the overall performance of this sector is frequently hindered by severe and persistent challenges. These units often suffer from obsolete manufacturing technology, poor quality control mechanisms, and an inherent inability to achieve economies of scale.</p>
                    <p>Access to timely and adequate credit remains their single biggest hurdle, alongside immense difficulties in marketing their products against large domestic conglomerates and multinational corporations. To combat these systemic issues, the government has shifted its overall approach from mere protection to active promotion and modernization. Key initiatives include the establishment of the Small Industries Development Bank of India to provide dedicated and streamlined financial assistance. The government has also implemented robust credit guarantee schemes to encourage banks to lend without collateral, and facilitated the creation of industrial estates and specialized technology hubs. These measures are designed to foster rapid modernization, improve product quality, and significantly enhance the global competitive edge of India's small scale enterprises.</p>
                `,

            {
                title: "4. Balance of Payments",
                mnemonic: "1991 Crisis Formula: Gulf War + Oil Spikes = Forex drop. Solution: Devaluation + IT Exports + Remittances = Recovery.",
                content: `
                    <p>The Balance of Payments is a systematic statistical record of all economic transactions between the residents of a country and the rest of the world over a specific period. It serves as a crucial macroeconomic indicator and is primarily divided into the current account, the capital account, and the official reserve account. The current account tracks the import and export of visible goods, invisible services, and unilateral transfers like remittances and foreign aid. The capital account records international investments such as foreign direct investment, external commercial borrowings, sovereign loans, and banking capital flows. A persistent deficit in the current account must generally be financed by a surplus in the capital account or by depleting the country's foreign exchange reserves.</p>
                    <p>Before 1991, India faced chronic and severe Balance of Payments deficits. The economy was heavily reliant on essential imports, particularly crude oil, fertilizers, and advanced capital goods. At the same time, export growth remained extremely sluggish due to an inward looking, protectionist trade policy that heavily discouraged global competitiveness. This long term structural imbalance culminated in the severe macroeconomic crisis of 1991. The immediate trigger was the geopolitical shock of the Gulf War, which dramatically spiked global oil prices and simultaneously reduced inward remittances from Indian workers in the Middle East. Consequently, India's foreign exchange reserves plummeted to an alarming level, barely sufficient to cover two weeks of essential imports, pushing the country to the absolute brink of a sovereign default and necessitating emergency loans from the IMF.</p>
                    <p>The post 1991 era witnessed a dramatic turnaround due to comprehensive economic reforms. To immediately stabilize the external sector, the government devalued the rupee to make Indian exports more competitive globally and eventually transitioned to a market determined exchange rate system. Furthermore, stringent restrictions on Foreign Direct Investment and Foreign Portfolio Investment were systematically lifted, leading to robust and sustained capital inflows. On the current account front, a massive boom in software and IT services exports, coupled with consistently strong remittances from the growing Indian diaspora, fundamentally altered the balance. Consequently, India transitioned from a state of acute forex scarcity to comfortably holding massive foreign exchange reserves.</p>

                content: `
                    <p>The New Trade Policy, introduced as a core component of the landmark 1991 economic reforms, marked a definitive shift from a closed, import substitution strategy to an outward looking, export led growth model. Prior to this policy, India's trade regime was heavily characterized by excessively high protective tariffs, strict import quotas, and incredibly complex licensing procedures that completely stifled global integration.</p>
                    <p>A central feature of the new policy was the systematic dismantling of quantitative restrictions on imports. The government methodically removed import quotas and drastically reduced peak customs duties from staggering highs of over 300 percent to levels much more closely aligned with international standards. Another pivotal reform during this period was decanalization. Previously, the import and export of many essential commodities were canalized, meaning they could only be traded by designated state owned monopolies, which led to immense inefficiencies. Decanalization moved these items to the Open General License list, allowing active private sector participation and dramatically increasing market efficiency and responsiveness.</p>
                    <p>To aggressively promote exports, the policy established robust and highly supportive frameworks for Export Oriented Units and Special Economic Zones. Special Economic Zones are designated duty free enclaves treated essentially as foreign territory for the purpose of trade operations, duties, and tariffs. Companies operating within these zones were offered massive incentives. These included comprehensive corporate tax holidays, the duty free procurement of raw materials and capital goods from domestic and international markets, and highly simplified labor and administrative compliance procedures. This single window clearance system removed traditional bureaucratic bottlenecks. Ultimately, these structural trade reforms successfully integrated the Indian economy with complex global supply chains. The policy encouraged rapid technological upgrades through the easier import of advanced capital goods, boosted total trade volume, and made Indian manufacturing and service sectors significantly more globally competitive. Furthermore, the focus shifted towards expanding the export basket beyond traditional agricultural goods to include high value manufactured products, pharmaceuticals, and engineering goods, cementing India's new position in global trade.</p>

            {
                title: "6. Role, Nature and Cropping Pattern",

                    <p>Agriculture serves as the fundamental backbone of the Indian economy. Its critical role extends far beyond merely contributing to the Gross Domestic Product. It remains the primary source of livelihood for more than half of the Indian population, ensuring national food security and playing a vital role in reducing rural poverty. Furthermore, agriculture supplies crucial raw materials to major agro based industries like textiles, sugar, jute, and food processing. It also generates significant export earnings for the country through high demand commodities like spices, tea, coffee, and basmati rice.</p>
                    <p>The nature of Indian agriculture is incredibly complex and deeply rooted in tradition. It is largely characterized by subsistence farming, where farmers grow food primarily for their own family's consumption rather than for commercial sale in the market. It is also famously described by economists as a gamble with the monsoons, given that a vast majority of the arable land lacks reliable irrigation infrastructure. The sector suffers heavily from highly fragmented and uneconomical small landholdings, which makes modern mechanization exceptionally difficult and cost prohibitive. Additionally, it is plagued by the widespread issue of disguised unemployment, where significantly more people are engaged in farming activities than are actually required for optimal production.</p>
                    <p>The cropping pattern indicates the proportion of agricultural land devoted to different crops at any given time. Historically, Indian agriculture was heavily biased towards essential food crops like rice, wheat, and coarse cereals. This was actively promoted by the government to ensure national self sufficiency, especially following the success of the Green Revolution in the 1960s. However, in recent years, there has been a noticeable and steady shift towards commercial and cash crops such as sugarcane, cotton, oilseeds, and high value horticulture. This gradual shift in the cropping pattern is primarily driven by rising market demand, better pricing structures, and the expansion of irrigation facilities, although government Minimum Support Price policies still heavily influence the final choices made by farmers.</p>

                quiz: [

            {
                title: "7. Economic Reforms 1991",
                mnemonic: "LPG Strategy: Liberalization (end license raj), Privatization (reduce public sector), Globalization (integrate with world).",
                content: `
                    <p>The Economic Reforms of 1991 represent a watershed moment in India's modern economic history, fundamentally and permanently altering its development trajectory. The origin of this severe crisis lay directly in the macroeconomic mismanagement of the 1980s. During that decade, the government ran unsustainably high fiscal deficits financed heavily by internal and external borrowing, which inevitably led to double digit inflation rates. Externally, the situation rapidly deteriorated into an unprecedented Balance of Payments crisis, which was further exacerbated by the geopolitical shock of the Gulf War. This left India dangerously low on foreign exchange reserves and on the absolute verge of defaulting on its international debt obligations.</p>
                    <p>To secure emergency funding and stabilize the economy, India approached the International Monetary Fund and the World Bank, agreeing to implement the comprehensive New Economic Policy. This sweeping policy framework had two distinct but deeply interconnected components. The first component was macroeconomic stabilization, which involved immediate, short term measures to control runaway inflation and restore the balance of payments. This was successfully achieved through a sharp, deliberate devaluation of the Indian rupee to boost exports, a tight monetary policy to curb excess liquidity, and strict fiscal discipline to drastically reduce government spending.</p>
                    <p>The second component consisted of structural reforms designed to fundamentally improve the long term efficiency, productivity, and global competitiveness of the economy. These transformative reforms are collectively known by the acronym LPG: Liberalization, Privatization, and Globalization. Liberalization effectively dismantled the oppressive license raj, finally freeing private enterprises from suffocating bureaucratic control and arbitrary restrictions. Privatization sought to carefully reduce the overwhelming dominance of the public sector through phased disinvestment and by opening previously reserved sectors to private capital investment. Globalization integrated the Indian economy with the rest of the world by slashing exorbitant import tariffs, decanalizing trade, and actively encouraging Foreign Direct Investment across various sectors. These sweeping changes effectively ended decades of state controlled economic planning, paving the way for the rapid modernization, higher growth rates, and increased entrepreneurial activity that characterize the contemporary Indian economy.</p>
                `,
                quiz: [

            {
                title: "8. Low Productivity in Agriculture",
                mnemonic: "Factors = G.I.T. (General: overcrowding. Institutional: small fragmented plots. Technological: lack of irrigation/seeds).",
                content: `
                    <p>Despite having one of the largest arable land areas in the entire world, India suffers from notoriously low agricultural productivity. This alarmingly low yield is evident both in terms of total production per hectare of land and production per agricultural worker when compared directly to global averages and other developing nations. The underlying causes for this low productivity are multi dimensional and can generally be categorized into general, institutional, and technological factors.</p>
                    <p>General causes include the massive, structural overcrowding of the agricultural sector due to a persistent lack of alternative employment opportunities in the industrial and service sectors. This immense population pressure leads to intense strain on agricultural land and widespread disguised unemployment. Institutional causes are deeply rooted in India's complex agrarian structure. The historical legacy of defective land tenure systems and the continuous, generational subdivision of land have resulted in highly fragmented and extremely small landholdings. These tiny, scattered plots make it economically unviable for farmers to invest in permanent land improvements or to utilize modern, efficient farming machinery.</p>
                    <p>Technological causes further compound this productivity problem. A significantly large portion of Indian agriculture remains entirely rain fed and highly vulnerable to monsoon failures due to inadequate and poorly maintained irrigation infrastructure. Furthermore, a vast majority of marginalized farmers continue to rely on traditional, low yielding seed varieties. They frequently apply insufficient or imbalanced chemical fertilizers, lack basic knowledge of soil health, and have very limited access to modern pest control methods. To actively combat these severe issues, the government has introduced several targeted measures. These include aggressive land consolidation programs, the massive expansion of both major and minor irrigation projects, and the provision of affordable institutional credit through Kisan Credit Cards to finally free farmers from the grip of exploitative local moneylenders. Promoting High Yielding Variety seeds, expanding crop insurance, and vastly improving agricultural extension services to actively educate farmers are also critical ongoing steps. Additionally, the recent push towards organic farming, soil health cards, and improved rural infrastructure like cold storage facilities aims to reduce post harvest losses and sustainably boost overall farm yields.</p>
                `,
                quiz: [
                    {

                    },
                    {
                        question: "What massive structural issue acts as a general cause of low productivity by straining agricultural land?",

                    {

                    {

                    {

                    {

                        correct: 2
                    },
                    {
                        question: "The recent push towards using what specific tool aims to educate farmers and sustainably boost overall farm yields?",

                ]
            },
            {
                title: "9. Capital Market",
                mnemonic: "PLSS: Primary (new issues), Long-term, Secondary (stock exchanges), SEBI (supreme regulator).",
                content: `
                    <p>The capital market is a vital and highly complex financial system that primarily deals in medium and long term funds. It serves as the critical, indispensable link between the savings generated by the household sector and the massive investment needs of the corporate sector and the government. A robust and well functioning capital market is absolutely essential for rapid national economic development because it facilitates large scale capital formation, provides a reliable platform for accurate price discovery, and allows businesses to seamlessly raise the funds necessary for expansion, innovation, and infrastructure development.</p>
                    <p>The Indian capital market structure is broadly divided into two main segments: the primary market and the secondary market. The primary market, also known as the new issue market, is the platform where companies raise fresh capital by issuing new shares, debentures, or bonds directly to the investing public. The secondary market primarily comprises the various stock exchanges, where previously issued securities are actively traded among investors. This secondary market provides crucial liquidity and ensures the continuous valuation of financial assets. The active participants in this market include retail individual investors, massive domestic institutional investors like mutual funds and insurance companies, Foreign Portfolio Investors, and various highly regulated financial intermediaries such as stockbrokers and merchant bankers.</p>
                    <p>Post 1991, the Indian capital market underwent sweeping, transformative reforms to heavily enhance transparency and rigorously protect retail investors. The Securities and Exchange Board of India was granted expansive statutory powers to act as the supreme, independent market regulator. The establishment of the National Stock Exchange introduced modern, screen based electronic trading, completely replacing the outdated and opaque open outcry system used previously. Furthermore, the introduction of depositories enabled the complete dematerialization of shares. This monumental shift eliminated the severe risks associated with physical paper certificates, such as theft and forgery, and vastly improved the overall speed, efficiency, and safety of market transactions. More recently, regulations surrounding corporate governance, insider trading, and mutual fund disclosures have been continually tightened, bringing the Indian capital market strictly in line with the best international financial practices.</p>
                `,
                quiz: [
                    {
                        question: "What is the primary function of a capital market?",

                    {

                        correct: 2
                    },
                    {
                        question: "In which segment do companies raise fresh capital by issuing new shares directly to the investing public?",
                        options: ["The secondary market", "The primary market / new issue market", "The unorganized money market", "The official reserve account"],

                    },
                    {
                        question: "What essential function does the secondary market (stock exchanges) provide for previously issued securities?",
                        options: ["It issues fresh capital for new startups", "It dictates the government's fiscal policy", "It provides crucial liquidity and continuous valuation", "It converts foreign direct investment into local currency"],
                        correct: 2
                    },
                    {
                        question: "Post 1991, which institution was granted expansive statutory powers to act as the supreme independent market regulator?",
                        options: ["Reserve Bank of India", "Discount and Finance House of India", "Small Industries Development Bank of India", "Securities and Exchange Board of India (SEBI)"],
                        correct: 3
                    },
                    {
                        question: "The establishment of the National Stock Exchange completely replaced what outdated trading mechanism?",
                        options: ["The electronic clearing system", "The negotiated dealing system", "The open outcry system", "The dematerialization system"],
                        correct: 2
                    },
                    {
                        question: "What major reform enabled the dematerialization of shares and eliminated risks associated with physical paper certificates?",
                        options: ["The establishment of the primary market", "The decanalization of monopolies", "The introduction of depositories", "The creation of Special Economic Zones"],

                    }
                ]
            }
        ];

        let currentTopicIndex = 0;
        let currentQuizIndex = 0;
        let score = 0;
        let hasAnswered = false;
        let currentQuizData = [];
        let currentSelectionRange = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            loadTopic(0);
            setupHighlighter();
        });

        function renderSidebar() {
            const list = document.getElementById('topic-list');
            list.innerHTML = '';
            studyData.forEach((topic, index) => {
                const li = document.createElement('li');
                
                li.className = index === currentTopicIndex 
                    ? 'mx-1 my-1 px-4 py-3 rounded-xl cursor-pointer transition bg-blue-50 text-blue-700 font-bold border border-blue-100' 
                    : 'mx-1 my-1 px-4 py-3 rounded-xl cursor-pointer transition hover:bg-gray-50 text-gray-600 font-medium border border-transparent';
                li.innerText = topic.title;
                li.onclick = () => loadTopic(index);
                list.appendChild(li);
            });
        }

        function loadTopic(index) {
            currentTopicIndex = index;
            const topic = studyData[index];
            
            document.getElementById('topic-title').innerText = topic.title;
            document.getElementById('topic-mnemonic').innerText = topic.mnemonic;
            
            // Load saved highlights if available
            const contentArea = document.getElementById('topic-content');
            const savedHtml = localStorage.getItem(`topic_html_${index}`);
            
            if (savedHtml) {
                contentArea.innerHTML = savedHtml;
            } else {
                contentArea.innerHTML = topic.content;
            }
            
            document.getElementById('btn-prev').disabled = index === 0;
            document.getElementById('btn-next').disabled = index === studyData.length - 1;
            
            renderSidebar();
            hideToolbar();

            const view = document.getElementById('study-view');
            view.classList.remove('fade-in');
            void view.offsetWidth;
            view.classList.add('fade-in');
        }

        function navigate(direction) {
            const newIndex = currentTopicIndex + direction;
            if (newIndex >= 0 && newIndex < studyData.length) {
                loadTopic(newIndex);
            }
        }

        function switchMode(mode) {
            const studyView = document.getElementById('study-view');
            const quizView = document.getElementById('quiz-view');
            const sidebar = document.getElementById('sidebar');
            const btnStudy = document.getElementById('btn-study');
            const btnQuiz = document.getElementById('btn-quiz');
            
            hideToolbar();

            if (mode === 'study') {
                studyView.classList.remove('hidden');
                sidebar.classList.remove('hidden');
                quizView.classList.add('hidden');
                
                btnStudy.classList.add('bg-white', 'shadow-sm', 'text-blue-700');
                btnStudy.classList.remove('bg-transparent', 'text-gray-500', 'hover:text-gray-900');
                
                btnQuiz.classList.add('bg-transparent', 'text-gray-500', 'hover:text-gray-900');
                btnQuiz.classList.remove('bg-white', 'shadow-sm', 'text-blue-700');
            } else {
                studyView.classList.add('hidden');
                sidebar.classList.add('hidden');
                quizView.classList.remove('hidden');
                
                btnQuiz.classList.add('bg-white', 'shadow-sm', 'text-blue-700');
                btnQuiz.classList.remove('bg-transparent', 'text-gray-500', 'hover:text-gray-900');
                
                btnStudy.classList.add('bg-transparent', 'text-gray-500', 'hover:text-gray-900');
                btnStudy.classList.remove('bg-white', 'shadow-sm', 'text-blue-700');
                
                startQuiz();
            }
        }

        /* Highlight feature logic */
        function setupHighlighter() {
            document.addEventListener('selectionchange', () => {
                const selection = window.getSelection();
                const toolbar = document.getElementById('highlight-toolbar');
                const contentArea = document.getElementById('topic-content');
                
                if (selection.isCollapsed || !contentArea.contains(selection.anchorNode)) {
                    // Do not hide toolbar immediately, to allow user to click colors
                    // It will hide when clicked elsewhere or highlight applied
                    return;
                }

                const range = selection.getRangeAt(0);
                currentSelectionRange = range.cloneRange();
                const rect = range.getBoundingClientRect();

                let topPos = rect.top - 50;
                // adjust if it goes off screen top
                if (topPos < 0) topPos = rect.bottom + 10;
                
                toolbar.style.top = `${topPos}px`;
                toolbar.style.left = `${rect.left + (rect.width / 2) - (toolbar.offsetWidth / 2)}px`;
                toolbar.classList.remove('hidden');
            });

            // Hide toolbar if clicking outside
            document.addEventListener('mousedown', (e) => {
                const toolbar = document.getElementById('highlight-toolbar');
                if (!toolbar.contains(e.target) && !document.getElementById('topic-content').contains(e.target)) {
                    hideToolbar();
                }
            });
        }

        function hideToolbar() {
            document.getElementById('highlight-toolbar').classList.add('hidden');
        }

        function applyHighlight(color) {
            const contentArea = document.getElementById('topic-content');
            contentArea.contentEditable = "true";
            
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(currentSelectionRange);
            
            document.execCommand('backColor', false, color);
            
            contentArea.contentEditable = "false";
            hideToolbar();
            selection.removeAllRanges();
            saveHighlights();
        }

        function clearHighlight() {
            applyHighlight('transparent');
        }

        function clearAllHighlights() {
            localStorage.removeItem(`topic_html_${currentTopicIndex}`);
            const topic = studyData[currentTopicIndex];
            document.getElementById('topic-content').innerHTML = topic.content;
            hideToolbar();
        }

        function saveHighlights() {
            const contentArea = document.getElementById('topic-content');
            localStorage.setItem(`topic_html_${currentTopicIndex}`, contentArea.innerHTML);
        }

        /* Quiz Logic */
        function startQuiz() {
            currentQuizData = studyData[currentTopicIndex].quiz;
            currentQuizIndex = 0;
            score = 0;
            
            document.getElementById('quiz-header-title').innerText = studyData[currentTopicIndex].title;
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('quiz-results').classList.add('hidden');
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            hasAnswered = false;
            const q = currentQuizData[currentQuizIndex];
            
            document.getElementById('quiz-progress').innerText = `${currentQuizIndex + 1} of ${currentQuizData.length}`;
            document.getElementById('quiz-question').innerText = q.question;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option w-full text-left px-6 py-5 text-gray-700 text-lg font-medium focus:outline-none';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-next-container').classList.add('hidden');
        }

        function selectAnswer(selectedIndex, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            const q = currentQuizData[currentQuizIndex];
            const allButtons = document.getElementById('quiz-options').children;

            if (selectedIndex === q.correct) {
                btnElement.classList.add('bg-green-50', 'border-green-400', 'text-green-800');
                btnElement.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                score++;
            } else {
                btnElement.classList.add('bg-red-50', 'border-red-300', 'text-red-700');
                btnElement.classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
                
                allButtons[q.correct].classList.add('bg-green-50', 'border-green-400', 'text-green-800');
                allButtons[q.correct].classList.remove('hover:bg-blue-50', 'hover:border-blue-300');
            }

            for (let btn of allButtons) {
                btn.classList.remove('quiz-option'); 
                btn.style.cursor = 'default';
            }

            document.getElementById('quiz-next-container').classList.remove('hidden');
        }

        function nextQuizQuestion() {
            currentQuizIndex++;
            if (currentQuizIndex < currentQuizData.length) {
                loadQuizQuestion();
            } else {
                showQuizResults();
            }
        }

        function showQuizResults() {
            document.getElementById('quiz-container').classList.add('hidden');
            const resultsDiv = document.getElementById('quiz-results');
            resultsDiv.classList.remove('hidden');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('total-questions').innerText = currentQuizData.length;
        }

    </script>
</body>
</html>
